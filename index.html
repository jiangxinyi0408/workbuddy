<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="jxy的小助理">
  <meta name="theme-color" content="#b8a8d4">
  <meta name="description" content="jxy的小助理">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/x-icon" href="images/favicon.ico">
  <link rel="apple-touch-icon" href="images/icon-180.png">
  <title>jxy的小助理</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <!-- 侧边导航遮罩 -->
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="window.__toggleSidebar(false)"></div>

  <!-- 左侧纵向导航栏 -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">💼</div>
      <div class="sidebar-brand">
        <div class="sidebar-brand-name">jxy的小助理</div>
        <div class="sidebar-brand-sub">个人专属</div>
      </div>
      <button class="sidebar-collapse" onclick="window.__toggleSidebar()" aria-label="折叠">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-item active" data-page="home" onclick="window.__navigate('home')">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">当日安排</span>
      </div>
      <div class="nav-item" data-page="work" onclick="window.__navigate('work')">
        <span class="nav-icon">📋</span>
        <span class="nav-label">每日业务安排</span>
      </div>
      <div class="nav-item" data-page="pingpong" onclick="window.__navigate('pingpong')">
        <span class="nav-icon">🏓</span>
        <span class="nav-label">打球时间</span>
      </div>
      <div class="nav-item" data-page="english" onclick="window.__navigate('english')">
        <span class="nav-icon">📚</span>
        <span class="nav-label">英语能力提升</span>
      </div>
      <div class="nav-item" data-page="weight" onclick="window.__navigate('weight')">
        <span class="nav-icon">🏃🏿</span>
        <span class="nav-label">健康管理</span>
      </div>
      <div class="nav-item" data-page="news" onclick="window.__navigate('news')">
        <span class="nav-icon">📰</span>
        <span class="nav-label">每日资讯</span>
      </div>
      <div class="nav-item" data-page="ai" onclick="window.__navigate('ai')">
        <span class="nav-icon">🤖</span>
        <span class="nav-label">了解AI</span>
      </div>
      <div class="nav-item" data-page="finance" onclick="window.__navigate('finance')">
        <span class="nav-icon">💰</span>
        <span class="nav-label">资产管理</span>
      </div>
    </nav>

    <div class="sidebar-footer">
      <div class="nav-item" data-page="more" onclick="window.__navigate('more')">
        <span class="nav-icon">⚙️</span>
        <span class="nav-label">设置</span>
      </div>
    </div>
  </aside>

  <!-- 主区域 -->
  <div class="main-wrapper" id="main-wrapper">
    <!-- 顶部 -->
    <header class="header">
      <button class="header-menu" onclick="window.__toggleSidebar()" aria-label="菜单">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <h1 id="page-title">当日安排</h1>
    </header>

    <!-- 主内容 -->
    <main id="main-content"></main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
